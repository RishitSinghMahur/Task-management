spring:
  profiles:
    active: dev


  data:
    mongodb:
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST}
      port: 14740
      password: ${REDIS_PASSWORD}

  mongodb:
    uri: ${MONGO_URI}
    database: taskManagementDB


apininja:
  api:
    key: ${API_KEY}

springdoc:
  swagger-ui:
    tagsSorter: alpha
    operationsSorter: alpha